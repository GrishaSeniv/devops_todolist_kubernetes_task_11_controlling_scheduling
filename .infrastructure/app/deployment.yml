apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp
  namespace: todoapp
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: todoapp
  template:
    metadata:
      labels:
        app: todoapp
    spec:
      containers:
        - name: todoapp
          image: ikulyk404/todoapp:4.0.1
          volumeMounts:
            - name: data
              mountPath: /app/data
            - name: app-secrets-volume
              mountPath: "/app/secrets"
              readOnly: true
            - name: app-config-volume
              mountPath: "/app/configs"
              readOnly: true
          resources:
            requests:
              memory: "256Mi"
              cpu: "150m"
            limits:
              memory: "256Mi"
              cpu: "150m"
          env:
            - name: PYTHONUNBUFFERED
              valueFrom:
                configMapKeyRef:
                  name: app-config
                  key: PYTHONUNBUFFERED
            - name: SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: SECRET_KEY
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_PASSWORD
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: app-secret
                  key: DB_HOST
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              path: api/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: api/ready
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
      # Node Affinity: try to schedule pods on nodes labeled app=todoapp
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100                  # Weight of preference
              preference:
                matchExpressions:
                  - key: app              # Node label key
                    operator: In
                    values:
                      - todoapp          # Node label value
        # Pod Anti-Affinity: avoid scheduling multiple pods on same node
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100                  # Preference weight
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app           # Match pods with label app=todoapp
                      operator: In
                      values:
                        - todoapp
                topologyKey: "kubernetes.io/hostname"  # Spread pods across nodes by hostname
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: pvc-data
        - name: app-secrets-volume
          secret:
            secretName: app-secret
        - name: app-config-volume
          configMap:
            name: app-config