apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: mysql
spec:
  selector:
    matchLabels:
      app: mysql
  replicas: 2
  serviceName: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: MYSQL_USER
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secrets
                  key: MYSQL_PASSWORD
            - name: MYSQL_DATABASE
              value: app_db
          ports:
            - name: mysql
              containerPort: 3306
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
              subPath: mysql
            - name: config-map
              mountPath: /docker-entrypoint-initdb.d
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
          livenessProbe:
            exec:
              command: [ "mysqladmin", "ping" ]
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
          readinessProbe:
            exec:
              command: [ "mysqladmin", "ping" ]
            initialDelaySeconds: 5
            periodSeconds: 2
            timeoutSeconds: 1
      tolerations:
        - key: "app"                     # The key of the taint to tolerate
          operator: "Equal"              # Operator to match the taint value
          value: "mysql"                 # Must match the value of the node's taint
          effect: "NoSchedule"           # Only tolerate NoSchedule taints
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: # Hard requirement for scheduling
            nodeSelectorTerms:
              - matchExpressions:
                  - key: app              # Node label key to match
                    operator: In          # Operator, pod will schedule if node label is in values
                    values:
                      - mysql            # Node must have label app=mysql
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution: # Hard anti-affinity rule
            - labelSelector:
                matchExpressions:
                  - key: app            # Match pods with label app=mysql
                    operator: In
                    values:
                      - mysql
              topologyKey: "kubernetes.io/hostname"  # Spread pods across nodes (hostnames)
              # so no two MySQL pods run on same node
      volumes:
        - name: config-map
          configMap:
            name: mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        resources:
          requests:
            storage: 2Gi
